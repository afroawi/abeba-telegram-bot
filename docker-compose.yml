version: "3.7"
services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${BOT_BIND:-127.0.0.1}:${BOT_PORT:-18151}:8081"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ABEBA_API_BASE_URL: ${ABEBA_API_BASE_URL:-}
      ABEBA_TELEGRAM_SERVICE_TOKEN: ${ABEBA_TELEGRAM_SERVICE_TOKEN:-}
      ABEBA_MINI_APP_URL: ${ABEBA_MINI_APP_URL:-}
      ABEBA_BOT_HEALTH_HOST: 0.0.0.0
      ABEBA_BOT_HEALTH_PORT: "8081"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
