version: "3.7"
services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:18151:8081"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      ABEBA_TELEGRAM_SERVICE_TOKEN: ${ABEBA_TELEGRAM_SERVICE_TOKEN:?Set ABEBA_TELEGRAM_SERVICE_TOKEN in .env}
      ABEBA_API_BASE_URL: ${ABEBA_API_BASE_URL:-https://dashboard.abebachat.com/api/v1/}
      ABEBA_MINI_APP_URL: ${ABEBA_MINI_APP_URL:-https://web.abebachat.com/telegram/chat}
      ABEBA_BOT_IMAGES_ENABLED: ${ABEBA_BOT_IMAGES_ENABLED:-true}
      ABEBA_BOT_AUDIO_ENABLED: ${ABEBA_BOT_AUDIO_ENABLED:-true}
      ABEBA_BOT_HEALTH_HOST: 0.0.0.0
      ABEBA_BOT_HEALTH_PORT: "8081"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
