# Append alongside the existing server blocks, not inside another server block.
# This is a status endpoint. The bot continues to use outbound Telegram polling.
server {
    listen 80;
    server_name bot.abebachat.com;

    location / {
        proxy_pass http://127.0.0.1:18151;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
